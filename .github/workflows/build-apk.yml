name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 웹앱 파일을 앱 안으로 복사
        run: |
          A=android/app/src/main/assets
          rm -rf "$A"
          mkdir -p "$A"
          cp index.html manifest.webmanifest icon-192.png icon-512.png "$A/"
          cp -r lib "$A/lib"

      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk docviewer.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest docviewer.apk \
            --title "문서 뷰어 APK (최신)" \
            --notes "자동 빌드: ${GITHUB_SHA::7}"
